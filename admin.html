<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beads by Jummymira admin sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap">
<style>
:root{
  --bg:#f8f2f9;--surface:#fff;--surface-2:#f3e8f6;--ink:#2a1630;--muted:#6a566f;--line:#e6d6e9;
  --accent:#b514d6;--accent-ink:#fff;--accent-soft:#f3d9f8;--focus:#7a0f91;--band:#2a1230;--band-fg:#f7ecf8;
  --ok:#0b6b36;--ok-bg:#d6f1e1;--warn:#7a4a00;--warn-bg:#fdebc8;--info:#1b4f8f;--info-bg:#dbe9fb;--bad:#a3201a;--bad-bg:#fadcd9;--off:#4a3d50;--off-bg:#e9e2ea;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#150c19;--surface:#1f1226;--surface-2:#2a1833;--ink:#f6eaf8;--muted:#b9a2bf;--line:#3a2644;
  --accent:#e07af5;--accent-ink:#1a0b1f;--accent-soft:#3b1a45;--focus:#f0b3ff;--band:#0e0712;
  --ok:#8be0ae;--ok-bg:#12351f;--warn:#f5cf86;--warn-bg:#3d2a07;--info:#a9cdf7;--info-bg:#132b49;--bad:#ffb4ac;--bad-bg:#4a1713;--off:#cdbfd2;--off-bg:#33263a;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-.02em;line-height:1.1}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{width:min(100%,72rem);margin-inline:auto;padding-inline:16px}
header.top{background:var(--band);color:var(--band-fg)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font:700 1.15rem var(--font-display)}
.brand small{display:block;font:400 .75rem var(--font-body);opacity:.75;margin-top:2px;overflow-wrap:anywhere}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:600 .9375rem var(--font-body);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:700 .75rem var(--font-body)}
main{padding-block:20px 64px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid transparent;font:600 .9375rem var(--font-body);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.light{background:rgba(255,255,255,.14);color:var(--band-fg)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.875rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 .875rem var(--font-body);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-weight:700;opacity:.7}
input,select,textarea{width:100%;min-width:0;min-height:44px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:400 1rem var(--font-body)}
textarea{min-height:84px;resize:vertical}
label{display:grid;gap:6px;font-size:.875rem;font-weight:600;min-width:0}
label small{font-weight:400;color:var(--muted)}
.field-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr))}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font:600 .75rem var(--font-body);white-space:nowrap}
.pill.New{background:var(--warn-bg);color:var(--warn)}
.pill.Confirmed{background:var(--info-bg);color:var(--info)}
.pill.Ready\ for\ delivery{background:var(--accent-soft);color:var(--ink)}
.pill.Out\ for\ delivery{background:var(--accent-soft);color:var(--ink)}
.pill.Delivered,.pill.Returned,.pill.Deposit\ refunded{background:var(--ok-bg);color:var(--ok)}
.pill.Cancelled{background:var(--off-bg);color:var(--off)}
.pill.hidden{background:var(--off-bg);color:var(--off)}
.pill.pay-wait{background:var(--warn-bg);color:var(--warn)}
.pill.pay-rep{background:var(--info-bg);color:var(--info)}
.pill.pay-ok{background:var(--ok-bg);color:var(--ok)}
.paybox{border:1.5px solid var(--line, currentColor);border-radius:14px;padding:14px;display:grid;gap:8px}
.paybox.alert{border-color:var(--warn)}
.pill.type{background:var(--surface-2);color:var(--muted)}
.list{display:grid;gap:10px}
.order{display:grid;gap:6px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:inherit;cursor:pointer;font:inherit}
.order:hover{border-color:var(--ink)}
.order .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.code{font:700 1.1rem ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.muted{color:var(--muted);font-size:.875rem}
.items-line{overflow-wrap:anywhere}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,16rem),1fr))}
.pcard{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pcard.off{opacity:.7}
.thumb{aspect-ratio:4/3;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pbody{display:grid;gap:8px;padding:12px 14px 14px}
.pbody h3{font-size:1.05rem;overflow-wrap:anywhere}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px}
.stepper button{width:40px;height:40px;border:0;background:none;color:var(--ink);font:600 1.3rem/1 var(--font-body);cursor:pointer;border-radius:50%}
.stepper output{min-width:34px;text-align:center;font-weight:700}
dialog{width:min(100%,40rem);max-height:92dvh;margin:auto;padding:0;border:0;border-radius:18px;background:var(--surface);color:var(--ink);overflow:auto}
dialog::backdrop{background:rgba(20,8,26,.62)}
@media (max-width:40rem){dialog{width:100%;margin:auto 0 0;border-radius:18px 18px 0 0}}
.sheet{position:relative;display:grid;gap:18px;padding:20px 16px 24px}
.x{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);color:var(--ink);font-size:1.4rem;cursor:pointer}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9375rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
table.items{width:100%;border-collapse:collapse;font-size:.9375rem}
table.items td,table.items th{padding:8px 0;border-bottom:1px solid var(--line);text-align:left}
table.items td:last-child,table.items th:last-child{text-align:right}
.progress{display:flex;flex-wrap:wrap;gap:6px}
.step{padding:4px 10px;border-radius:999px;font:600 .75rem var(--font-body);background:var(--surface-2);color:var(--muted)}
.step.done{background:var(--ok-bg);color:var(--ok)}
.step.now{background:var(--accent);color:var(--accent-ink)}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.cdot{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:600 .875rem var(--font-body);cursor:pointer}
.cdot i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.2)}
.cdot[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.photo{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pic{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);display:grid;grid-template-rows:auto auto}
.pic .im{aspect-ratio:1;background:var(--surface-2)}
.pic .im img{width:100%;height:100%;object-fit:cover;display:block}
.pic .badge{position:absolute;left:6px;top:6px;background:var(--accent);color:var(--accent-ink);font-size:.6875rem;font-weight:700;padding:2px 8px;border-radius:99px}
.pic .acts{display:flex;justify-content:space-between;gap:2px;padding:4px}
.pic .acts button{min-width:2.5rem;min-height:2.5rem;border:0;border-radius:8px;background:transparent;color:var(--ink);font:600 1rem inherit;cursor:pointer}
.pic .acts button:disabled{opacity:.3;cursor:default}
.pic .acts button:hover:not(:disabled){background:var(--accent-soft)}
.photo .thumb{width:120px;aspect-ratio:1;border-radius:12px;flex:none}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600}
.toggle input{width:22px;height:22px;min-height:0}
.err{color:var(--bad);font-weight:600}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 18px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.bad{background:var(--bad);color:#fff}
.skeleton{padding:48px 16px;text-align:center;color:var(--muted)}
.hint{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:.9375rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

#login{min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
#login[hidden]{display:none}
.lcard{width:min(100%,26rem);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 22px;display:grid;gap:16px}
.lcard h1{font-size:1.75rem}
.lcard .sub{color:var(--muted);margin:0}
.lcard form{display:grid;gap:14px}
.lcard .pw{position:relative}
.lcard .pw input{padding-right:84px}
.lcard .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:36px;padding:0 12px;border:0;border-radius:999px;background:var(--surface-2);color:var(--ink);font:600 .8125rem var(--font-body);cursor:pointer}
.lcard .check{display:flex;align-items:center;gap:10px;font-weight:500}
.lcard .check input{width:22px;height:22px;min-height:0;flex:none}
.lcard .logo{font:700 1.15rem var(--font-display);color:var(--accent)}
.lcard .note{font-size:.8125rem;color:var(--muted)}
</style>
</head>
<body>
<section id="login" hidden>
  <div class="lcard">
    <div class="logo">Beads by Jummymira</div>
    <div><h1>Shop admin</h1><p class="sub">Sign in to manage your beads, orders and payments.</p></div>
    <form id="loginForm" autocomplete="on">
      <label>Username<input id="lUser" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
      <label>Password<span class="pw"><input id="lPass" name="password" type="password" autocomplete="current-password" required><button id="lShow" type="button" aria-pressed="false">Show</button></span></label>
      <label class="check"><input id="lRemember" type="checkbox"> Keep me signed in on this device for 30 days</label>
      <p class="err" id="lErr" role="alert" hidden></p>
      <button class="btn primary" id="lGo" type="submit">Sign in</button>
    </form>
    <p class="note">Only use "keep me signed in" on your own phone or computer. Forgot your password? In your Google Sheet open Beads shop &gt; Create or reset an admin login.</p>
  </div>
</section>
<div id="shell" hidden>
<header class="top">
  <div class="wrap">
    <div class="brand">Beads by Jummymira<small id="who">Admin dashboard</small></div>
    <div class="row" style="gap:8px"><button class="btn light sm" id="refreshBtn" type="button">Refresh</button><button class="btn light sm" id="outBtn" type="button">Sign out</button></div>
  </div>
</header>
<nav class="tabs" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" data-tab="orders" aria-selected="true">Orders <span class="badge" id="newBadge" hidden>0</span></button>
    <button class="tab" role="tab" data-tab="sale" aria-selected="false">Beads for sale</button>
    <button class="tab" role="tab" data-tab="rent" aria-selected="false">Rentals</button>
    <button class="tab" role="tab" data-tab="settings" aria-selected="false">Settings</button>
  </div>
</nav>
<main class="wrap" id="app"><div class="skeleton">Loading your shop...</div></main>

<dialog id="orderDlg" aria-label="Order details"><div class="sheet" id="orderBody"></div></dialog>
<dialog id="prodDlg" aria-label="Edit bead"><div class="sheet" id="prodBody"></div></dialog>
</div>
<div id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script>
var S = {tab:'orders', settings:{}, sale:[], rent:[], orders:[], statuses:[], cats:[], colours:[], of:{status:'open', type:'all', q:''}, pq:{sale:'', rent:''}};
var COLOR_HEX = {gold:'#d9a93a', ink:'#241a2b', mag:'#c71be8', pearl:'#f3ebf2', coral:'#e8624c', blush:'#f3a6c4'};
var FLOW_SALE = ['New','Confirmed','Ready for delivery','Out for delivery','Delivered'];
var FLOW_RENT = FLOW_SALE.concat(['Returned','Deposit refunded']);
var NEXT = {'New':['Confirm order','Confirmed'], 'Confirmed':['Mark ready for delivery','Ready for delivery'], 'Ready for delivery':['Out for delivery','Out for delivery'],
  'Out for delivery':['Mark delivered','Delivered']};
var NEXT_RENT = {'Delivered':['Mark returned','Returned'], 'Returned':['Mark deposit refunded','Deposit refunded']};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function naira(n){ return '₦' + Number(n || 0).toLocaleString('en-NG'); }
var API = (window.JM_CONFIG && window.JM_CONFIG.apiUrl) || '';
var TOKEN_KEY = 'jm_admin_session';
var session = null;
function readSession(){
  var raw = null;
  try { raw = sessionStorage.getItem(TOKEN_KEY) || localStorage.getItem(TOKEN_KEY); } catch (e) {}
  if (!raw) return null;
  try { var o = JSON.parse(raw); if (o && o.token && o.expires > Date.now()) return o; } catch (e) {}
  clearSession(); return null;
}
function saveSession(o, remember){
  clearSession();
  try { (remember ? localStorage : sessionStorage).setItem(TOKEN_KEY, JSON.stringify(o)); } catch (e) {}
}
function clearSession(){ try { sessionStorage.removeItem(TOKEN_KEY); localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
function post(body){
  return fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body), credentials:'omit', referrerPolicy:'no-referrer'})
    .then(function(r){ return r.json(); })
    .catch(function(){ var e = new Error('We could not reach the shop. Check your internet connection and try again.'); e.offline = true; throw e; });
}
function call(fn){
  var args = [].slice.call(arguments, 1);
  if (!session) return Promise.reject(authError());
  return post({action:'admin', token:session.token, fn:fn, args:args}).then(function(d){
    if (d && d.auth){ showLogin('Your session has ended. Please sign in again.'); throw authError(); }
    if (!d || !d.ok) throw new Error((d && d.error) || 'Something went wrong. Please try again.');
    return d.data;
  });
}
function authError(){ var e = new Error('Please sign in.'); e.auth = true; return e; }

/* ---------- Sign in / out ---------- */
function showLogin(msg){
  session = null; clearSession();
  $('shell').hidden = true; $('login').hidden = false; document.title = 'Beads by Jummymira admin sign in';
  $('lPass').value = ''; $('lGo').disabled = false; $('lGo').textContent = 'Sign in';
  var er = $('lErr');
  if (msg){ er.textContent = msg; er.hidden = false; } else { er.hidden = true; }
  if (!API){ er.textContent = 'This page is not connected to your shop yet. Put your shop link in config.js (see the setup guide).'; er.hidden = false; $('lGo').disabled = true; }
  setTimeout(function(){ ($('lUser').value ? $('lPass') : $('lUser')).focus(); }, 30);
}
function showShell(){
  $('login').hidden = true; $('shell').hidden = false; document.title = 'Beads by Jummymira admin';
  $('who').textContent = 'Signed in as ' + session.username;
}
$('lShow').onclick = function(){
  var p = $('lPass'), on = p.type === 'password'; p.type = on ? 'text' : 'password';
  this.textContent = on ? 'Hide' : 'Show'; this.setAttribute('aria-pressed', on ? 'true' : 'false');
};
$('loginForm').onsubmit = function(e){
  e.preventDefault();
  var u = $('lUser').value.trim(), p = $('lPass').value, er = $('lErr'), b = $('lGo');
  if (!u || !p){ er.textContent = 'Enter your username and password.'; er.hidden = false; return; }
  er.hidden = true; b.disabled = true; b.textContent = 'Signing in...';
  post({action:'login', username:u, password:p, remember:$('lRemember').checked}).then(function(d){
    if (!d || !d.ok) throw new Error((d && d.error) || 'Could not sign in. Please try again.');
    session = {token:d.token, username:d.username, expires:d.expires};
    saveSession(session, $('lRemember').checked);
    $('lPass').value = '';
    showShell(); load();
  }).catch(function(x){ b.disabled = false; b.textContent = 'Sign in'; er.textContent = errMsg(x); er.hidden = false; $('lPass').select(); });
};
$('outBtn').onclick = function(){
  var t = session && session.token;
  if (t) post({action:'logout', token:t}).catch(function(){});
  showLogin(); $('lErr').hidden = true;
};
function start(){
  session = readSession();
  if (session && API){ showShell(); load(); } else showLogin();
}
function errMsg(e){ var m = (e && e.message) || String(e); return m.replace(/^Error:\s*/, ''); }
var toastTimer;
function toast(msg, bad){ var t = $('toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.hidden = true; }, bad ? 6000 : 2800); }
function ago(s){
  if (!s) return '';
  var d = new Date(s.replace(' ', 'T')); if (isNaN(d)) return s;
  var m = Math.round((Date.now() - d.getTime()) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  var h = Math.round(m / 60); if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
  var dd = Math.round(h / 24); if (dd < 30) return dd + (dd === 1 ? ' day ago' : ' days ago');
  return s.slice(0, 10);
}
function waNumber(p){
  var d = String(p || '').replace(/\D/g, '');
  if (d.indexOf('00') === 0) d = d.slice(2);
  if (d.charAt(0) === '0' && d.length === 11) d = '234' + d.slice(1);
  return d;
}
function isOpen(o){ return ['Cancelled','Deposit refunded'].indexOf(o.status) < 0 && !(o.type === 'sale' && o.status === 'Delivered'); }

/* ---------- Load ---------- */
function load(quiet){
  if (!quiet) $('app').innerHTML = '<div class="skeleton">Loading your shop...</div>';
  return call('adminBootstrap').then(function(d){
    S.settings = d.settings; S.sale = d.sale; S.rent = d.rent; S.orders = d.orders; S.statuses = d.statuses; S.cats = d.cats; S.colours = d.colours;
    render();
  }).catch(function(e){
    if (e && e.auth) return;
    $('app').innerHTML = '<div class="empty"><p class="err">' + esc(errMsg(e)) + '</p><button class="btn primary" id="retry" type="button">Try again</button></div>';
    $('retry').onclick = function(){ load(); };
  });
}
$('refreshBtn').onclick = function(){ load(true).then(function(){ toast('Updated'); }); };
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick = function(){ S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); };
});

function render(){
  document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab === S.tab ? 'true' : 'false'); });
  var n = S.orders.filter(function(o){ return o.status === 'New'; }).length;
  $('newBadge').textContent = n; $('newBadge').hidden = n === 0;
  if (S.tab === 'orders') renderOrders();
  else if (S.tab === 'sale' || S.tab === 'rent') renderProducts(S.tab);
  else renderSettings();
}

/* ---------- Orders ---------- */
function renderOrders(){
  var f = S.of, counts = {};
  S.orders.forEach(function(o){ counts[o.status] = (counts[o.status] || 0) + 1; });
  var openN = S.orders.filter(isOpen).length;
  var chips = [['open','Open',openN],['New','New',counts['New']||0],['Confirmed','Confirmed',counts['Confirmed']||0],['Ready for delivery','Ready for delivery',counts['Ready for delivery']||0],
    ['Out for delivery','Out for delivery',counts['Out for delivery']||0],['Delivered','Delivered',counts['Delivered']||0],['all','All',S.orders.length]];
  var q = f.q.toLowerCase().replace(/[^a-z0-9 ]/g, '');

function findOrder(code){ return S.orders.filter(function(o){ return o.code === code; })[0]; }

function copy(text){

}

/* ---------- Products ---------- */
var MAXPICS = 10;
function thumbHtml(p){

  var c = (p.colours.length ? p.colours : ['gold','mag']).map(function(k){ return COLOR_HEX[k] || '#999'; });

function renderProducts(type){
  var list = S[type], q = S.pq[type].toLowerCase();

  else h += '<div class="grid">' + shown.map(function(p){
    return '<article class="pcard' + (p.visible ? '' : ' off') + '" data-id="' + esc(p.id) + '"><div class="thumb">' + thumbHtml(p) + '</div><div class="pbody">' +
      '<div class="row between"><span class="pill type">' + esc(p.tag) + '</span><span>' + ((p.photos || []).length > 1 ? '<span class="pill type">' + p.photos.length + ' photos</span> ' : '') + (p.visible ? '' : '<span class="pill hidden">Hidden</span>') + '</span></div>' +
      '<h3>' + esc(p.name) + '</h3><div><b>' + naira(p.price) + '</b>' + (type === 'rent' ? ' <span class="muted">/ ' + esc(S.settings.blockDays || 3) + ' days, deposit ' + naira(p.deposit) + '</span>' : '') + '</div>' +
      (type === 'rent' && p.backOn ? '<div class="muted">Back on ' + esc(p.backOn) + '</div>' : '') +
      '<div class="row between"><div class="stepper" role="group" aria-label="Stock for ' + esc(p.name) + '"><button type="button" data-d="-1" aria-label="One less">&minus;</button><output>' + p.stock + '</output><button type="button" data-d="1" aria-label="One more">+</button></div>' +
      '<button class="btn ghost sm" type="button" data-edit="1">Edit</button></div></div></article>';
  }).join('') + '</div>';
  $('app').innerHTML = h;
  $('addBtn').onclick = function(){ openProduct(type, null); };
  $('pq').oninput = function(){ S.pq[type] = this.value; var pos = this.selectionStart; renderProducts(type); var i = $('pq'); i.focus(); try { i.setSelectionRange(pos, pos); } catch (e) {} };
  document.querySelectorAll('.pcard').forEach(function(card){

      b.onclick = function(){
        var p = S[type].filter(function(x){ return x.id === id; })[0]; if (!p) return;
        var next = Math.max(0, p.stock + Number(b.dataset.d)); if (next === p.stock) return;
        var old = p.stock; p.stock = next; card.querySelector('output').textContent = next;
        saveProduct(type, p, true).catch(function(){ p.stock = old; card.querySelector('output').textContent = old; });
      };
    });
  });
}
function saveProduct(type, p, quiet){
  var payload = {id:p.id, name:p.name, category:p.tag, price:p.price, deposit:p.deposit, stock:p.stock, backOn:p.backOn, desc:p.desc, images:(p.photos && p.photos.length ? p.photos : (p.photo ? [p.photo] : [])), colours:p.colours, visible:p.visible};
  return call('adminSaveProduct', type, payload).then(function(saved){
    var i = -1; S[type].forEach(function(x, k){ if (x.id === saved.id) i = k; });
    if (i > -1) S[type][i] = saved; else S[type].push(saved);
    if (!quiet) toast('Saved ' + saved.name);
    return saved;
  }).catch(function(e){ toast(errMsg(e), true); throw e; });
}
function openProduct(type, id){
  var p = id ? S[type].filter(function(x){ return x.id === id; })[0] : {id:'', name:'', tag:S.cats[0], price:0, deposit:0, stock:1, backOn:'', desc:'', photo:'', photos:[], colours:[], visible:true};

        S.colours.map(function(c){ return '<button type="button" class="cdot" data-c="' + c + '" aria-pressed="' + (draft.colours.indexOf(c) > -1) + '"><i style="background:' + COLOR_HEX[c] + '"></i>' + c + '</button>'; }).join('') + '</div></div>' +

      if (!b.dataset.sure){ b.dataset.sure = '1'; b.textContent = 'Tap again to delete for good'; return; }
      b.disabled = true;
      call('adminDeleteProduct', type, id).then(function(){ S[type] = S[type].filter(function(x){ return x.id !== id; }); dlg.close(); render(); toast('Deleted'); })
        .catch(function(e){ b.disabled = false; $('pErr').textContent = errMsg(e); $('pErr').hidden = false; });
    };
  }
  draw();
  var dlg = $('prodDlg'); if (!dlg.open) dlg.showModal();
}
function shrink(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var max = 1200, s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('That file could not be read as a photo.')); };
    img.src = url;
  });
}

/* ---------- Settings ---------- */
function renderSettings(){
  var s = S.settings;
  function f(k, label, hint, type){ return '<label>' + label + (hint ? '<small>' + hint + '</small>' : '') + '<input id="st_' + k + '" ' + (type ? 'type="' + type + '" ' : '') + 'value="' + esc(s[k] || '') + '"></label>'; }
  $('app').innerHTML = '<h2 style="margin-bottom:14px">Settings</h2><div class="list" style="max-width:40rem">' +
    f('whatsapp', 'WhatsApp number', 'With country code, digits only. Example: 2348012345678. Customers send their orders here.') +
    f('instagram', 'Instagram handle', 'Without the @') + f('email', 'Contact email', 'Shown in the site footer') +
    '<h3 style="margin-top:6px">Payment by transfer</h3>' +
    (s.payAccountNumber ? '' : '<div class="paybox alert"><b>Add your OPay account</b><div>Customers cannot see where to send money until you fill in the number and name below.</div></div>') +
    f('payBank', 'Bank or wallet', 'Normally OPay') +
    f('payAccountNumber', 'OPay account number', '10 digits. Customers see this after they place an order. Double check it.') +
    f('payAccountName', 'Name on the account', 'Exactly as it shows in your OPay app, so customers can check it.') +
    f('paymentNote', 'Extra payment instructions', 'Optional. Example: "Put your order code as the transfer remark."') +
    '<h3 style="margin-top:6px">Site</h3>' +
    f('siteUrl', 'Your store web address', 'Starts with https://. Used for the Track order link in the emails customers receive. Example: https://beadsbyjummymira.pages.dev') +
    f('announcement', 'Top banner line', 'The line at the very top of the site') +
    f('blockDays', 'Rental days per price', 'Rental prices cover this many days. Longer rentals are charged in extra blocks.', 'number') +
    f('alertEmails', 'Send order alerts to', 'Email addresses that get an alert when an order comes in or a customer says they have paid. Separate several with commas.') +
    '<p class="err" id="sErr" hidden></p><div class="row"><button class="btn primary" id="sSave" type="button">Save settings</button></div>' +
    '<h3 style="margin-top:18px">Change my password</h3>' +
    '<label>Current password<input id="pwOld" type="password" autocomplete="current-password"></label>' +
    '<label>New password<small>At least 10 characters. A few random words with numbers works well.</small><input id="pwNew" type="password" autocomplete="new-password"></label>' +
    '<label>Type the new password again<input id="pwNew2" type="password" autocomplete="new-password"></label>' +
    '<p class="err" id="pwErr" hidden></p><div class="row"><button class="btn ghost" id="pwSave" type="button">Change password</button></div>' +
    '<div class="hint">Your products, orders and settings live in your Google Sheet. You can also edit them there directly. Photos are in your Drive folder "Beads by Jummymira - photos". Never share your admin password. Anyone with it can see orders and customer details.</div></div>';
  $('pwSave').onclick = function(){
    var b = this, er = $('pwErr'); er.hidden = true;
    if ($('pwNew').value !== $('pwNew2').value){ er.textContent = 'The two new passwords do not match.'; er.hidden = false; return; }
    b.disabled = true;
    call('adminChangePassword', $('pwOld').value, $('pwNew').value).then(function(){
      b.disabled = false; $('pwOld').value = $('pwNew').value = $('pwNew2').value = ''; toast('Password changed');
    }).catch(function(e){ b.disabled = false; if (e && e.auth) return; er.textContent = errMsg(e); er.hidden = false; });
  };
  $('sSave').onclick = function(){
    var b = this, o = {};
    ['whatsapp','instagram','email','payBank','payAccountNumber','payAccountName','paymentNote','siteUrl','announcement','blockDays','alertEmails'].forEach(function(k){ o[k] = $('st_' + k).value; });
    b.disabled = true; $('sErr').hidden = true;
    call('adminSaveSettings', o).then(function(st){ S.settings = st; b.disabled = false; toast('Settings saved'); renderSettings(); })
      .catch(function(e){ b.disabled = false; $('sErr').textContent = errMsg(e); $('sErr').hidden = false; });
  };
}

start();
